    bullets:
      - "Assumi o app iOS como principal contribuidor: cerca de 1.400 commits e 125 pull requests integrados em cinco meses, com 33 builds no TestFlight."
      - "Construí o bloqueio de sites de apostas na camada de DNS em uma Network Extension, com lista global baixada, lista no aparelho para bloqueios instantâneos e recuperação do túnel na troca de rede."
      - "Separei o app em 25 módulos Tuist com fronteiras verificadas pelo compilador e ampliei a suíte para 3.169 testes em Swift Testing; um gate de CI mantém SDKs de terceiros fora da extensão."
