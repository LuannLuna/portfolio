  - role: "Engenheiro de Software iOS Sênior"
    company: "Sebratec — alocado na Petz"
    period: "Ago 2022 — Set 2025"
    appLinks:
      - name: "Petz"
        url: "https://apps.apple.com/br/app/petz-tudo-que-seu-pet-precisa/id1250491446"
    bullets:
      - "Arquitetei o módulo de fidelidade da Petz com MVVM e Clean Architecture. Ele virou o primeiro fluxo SwiftUI da empresa em produção com lógica de negócio e gerou mais de 1.000 vendas orgânicas na primeira semana."
      - "Entrei no war room de um crash que afetou o app, usado por mais de 1,5M de pessoas. Encontrei um valor incorreto no Remote Config; o serviço voltou em cerca de três horas. Depois tratei os 12 crashes mais frequentes com Crashlytics e Instruments. As sessões sem crash ficaram em torno de 99%."
      - "Migrei oito telas de UIKit para SwiftUI com mais uma pessoa. O prazo de entrega de features caiu de três meses para seis semanas, e o time adotou SwiftUI como padrão."

  - role: "Engenheiro iOS / Arquiteto de Soluções Digitais"
