jobs:
  - role: "Engenheiro de Software iOS Sênior"
    company: "L M Tecnologia — alocado na BeSafe"
    period: "Jun 2026 — Nov 2026"
    current: false
    appLinks:
      - name: "BeSafe"
        url: "https://apps.apple.com/br/app/besafe-bloqueador-de-apostas/id6803982275"
    bullets:
      - "Entreguei o app na App Store dentro do prazo de lançamento acordado em contrato como principal contribuidor iOS, cobrindo a primeira release e a aprovação da Apple."
      - "Construí o bloqueio de sites de apostas na camada de DNS em uma Network Extension: lista global baixada, lista no aparelho para bloqueios instantâneos e recuperação do túnel na troca de rede."
      - "Liderei a migração de UIKit/MVC para SwiftUI com Clean Architecture — NavigationStack, @Observable e async/await — chegando a 200+ views SwiftUI e apenas 5 controllers UIKit; todas as views SwiftUI saíram com VoiceOver e Dynamic Type."
      - "Separei o app em 25 Swift Packages com fronteiras verificadas pelo compilador, incluindo um design system tokenizado gerado a partir do Figma e strings prontas para localização; um gate de CI mantém SDKs de terceiros fora da extensão."
      - "Respondi de ponta a ponta por rede, sessão e execução em background — interceptors REST com renovação automática de token, credenciais no Keychain, gatilhos de APNs/BGTask e integração com Firebase/RevenueCat — e corrigi uma race condition entre processos que causava logouts determinísticos, unificando o armazenamento de tokens em uma fonte única."
      - "Ampliei a suíte para 3.169 testes em Swift Testing e 270 baselines de snapshot, adicionei 45+ fluxos Maestro em dispositivos e releases noturnos via fastlane/TestFlight, e implementei telemetria no Firebase sem PII para diagnosticar falhas de recuperação de rede."

  - role: "Engenheiro de Software iOS Sênior"
    company: "Hi-Tech Talents — alocado na LikeToKnow.It (LTK)"
    period: "Out 2025 — Abr 2026"
    current: false
    appLinks:
      - name: "LTK"
        url: "https://apps.apple.com/br/app/ltk-liketoknow-it/id1154027990"
    bullets:
      - "Coloquei três endpoints legados de busca atrás de uma camada única com async/await na base com strict concurrency do Swift 6. O tempo de resposta caiu de 900ms para 200ms."
      - "Entreguei três componentes SwiftUI como Swift Packages no design system da LTK, sustentando a nova experiência de busca de ponta a ponta."
      - "Criei um fluxo no Maestro do login à loja do criador, complementando a cobertura XCUITest e capturando regressões entre telas que testes unitários não pegariam."

  - role: "Engenheiro de Software iOS Sênior"
    company: "Sebratec — alocado na Petz"
    period: "Ago 2022 — Set 2025"
    appLinks:
      - name: "Petz"
        url: "https://apps.apple.com/br/app/petz-tudo-que-seu-pet-precisa/id1250491446"
    bullets:
      - "Arquitetei o módulo de fidelidade da Petz com MVVM e Clean Architecture, usando Combine em alguns fluxos reativos. Ele virou o primeiro fluxo SwiftUI da empresa em produção com lógica de negócio e gerou mais de 1.000 vendas orgânicas na primeira semana."
      - "Liderei a triagem em war-room de um crash que afetou o app, usado por mais de 1,5M de pessoas. Rastreei o problema até um valor incorreto no Remote Config e restabeleci o serviço em cerca de três horas. Depois tratei os 12 crashes mais frequentes com Crashlytics e Instruments; as sessões sem crash ficaram em torno de 99%."
      - "Migrei oito telas de UIKit para SwiftUI com mais uma pessoa. O prazo de entrega de features caiu de três meses para seis semanas, e o time adotou SwiftUI como padrão."

  - role: "Engenheiro iOS / Arquiteto de Soluções Digitais"
