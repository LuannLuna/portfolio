      - "Fiz pair com o time de Chat no SDK da Bia, a assistente virtual da Next. Revisei código e tratei bugs, inclusive na passagem do bot para o atendimento humano."
      - "Fiz pair e revisei código com uma pessoa desenvolvedora iOS júnior. Discutíamos arquitetura e implementação conforme as dúvidas apareciam."

