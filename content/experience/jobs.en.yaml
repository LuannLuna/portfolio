        url: "https://apps.apple.com/br/app/besafe-bloqueador-de-apostas/id6803982275"
    bullets:
      - "Delivered the app to the App Store by the launch deadline agreed in the contract as the main iOS contributor, through first release and Apple approval."
      - "Built DNS-level betting-site blocking in a Network Extension: a downloaded global blocklist, an on-device list for instant requests, and tunnel recovery when the network changes."
      - "Led the UIKit/MVC → SwiftUI migration with Clean Architecture (NavigationStack, @Observable state, async/await), ending with 200+ SwiftUI views and only 5 UIKit controllers; every SwiftUI view shipped with VoiceOver and Dynamic Type."
