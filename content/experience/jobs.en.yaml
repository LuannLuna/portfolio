      - "Grew the suite to 3,169 Swift Testing cases and 270 snapshot baselines, added 45+ on-device Maestro flows and nightly fastlane/TestFlight releases, and instrumented Firebase telemetry with PII stripped to diagnose Wi-Fi/cellular recovery bugs."

