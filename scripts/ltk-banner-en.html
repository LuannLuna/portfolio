<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LTK Search — banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1983px;
        height: 793px;
        overflow: hidden;
        background: #fff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }

      body { padding: 18px; }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background:
          radial-gradient(900px 700px at 88% 42%, rgba(99, 102, 241, 0.36), transparent 66%),
          radial-gradient(720px 540px at 76% 104%, rgba(34, 211, 238, 0.28), transparent 68%),
          radial-gradient(560px 460px at 8% -6%, rgba(255, 255, 255, 1), transparent 62%),
          linear-gradient(115deg, #f7f9ff 0%, #e9efff 38%, #d5e2ff 72%, #c7dbff 100%);
      }

      .wave {
        position: absolute;
        z-index: 0;
        left: -210px;
        bottom: -320px;
        width: 980px;
        height: 660px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(99, 102, 241, 0.20), rgba(34, 211, 238, 0.10), transparent 72%);
        filter: blur(10px);
      }

      /* Optional Gemini-generated artwork */

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(15, 19, 32, 0.07) 1px, transparent 0);
        background-size: 26px 26px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.5), transparent 55%);
      }

      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.94) 0%,
          rgba(255, 255, 255, 0.80) 30%,
          rgba(255, 255, 255, 0.22) 56%,
          rgba(255, 255, 255, 0) 72%
        );
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 800px;
        padding: 54px 0 44px 70px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-family: 'Inter', sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 1;
        color: #080a13;
      }

      .brand .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #6366f1;
      }

      h1 {
        margin-top: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 148px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.86;
        color: #080a13;
      }

      .sub {
        margin-top: 26px;
        max-width: 620px;
        font-size: 29px;
        font-weight: 400;
        line-height: 1.34;
        letter-spacing: -0.01em;
        color: #3f4659;
      }

      .features {
        display: flex;
        align-items: center;
        gap: 26px;
        margin-top: 38px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 19px;
        font-weight: 500;
        color: #2b3145;
        white-space: nowrap;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        color: #fff;
        box-shadow: 0 10px 24px -10px rgba(15, 19, 32, 0.55);
      }

      .icon svg { width: 22px; height: 22px; }

      .i1 { background: linear-gradient(145deg, #8189ff, #4f46e5); }
      .i2 { background: linear-gradient(145deg, #c084fc, #7c3aed); }
      .i3 { background: linear-gradient(145deg, #67e8f9, #0891b2); }

      .label {
        margin-top: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #4f46e5;
      }

      /* ------------------------------- phones ------------------------------- */
      .glow {
        position: absolute;
        z-index: 1;
        right: 40px;
        top: 55px;
        width: 900px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(99, 102, 241, 0.32), rgba(34, 211, 238, 0.16), transparent 72%);
        filter: blur(18px);
      }

      .phone {
        position: absolute;
        width: 292px;
        height: 632px;
        padding: 11px;
        border-radius: 50px;
        background: linear-gradient(145deg, #ffffff 0%, #e6e8ef 18%, #b7bcc8 52%, #5f636e 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.8) inset,
          0 45px 80px -28px rgba(15, 19, 32, 0.65),
          0 8px 18px rgba(15, 19, 32, 0.22);
      }

      .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 40px;
        background: #000;
      }

      .p1 {
        left: 920px;
        top: 130px;
        z-index: 4;
        transform: rotate(-6deg);
      }

      .p2 {
        left: 1135px;
        top: 82px;
        z-index: 3;
        transform: rotate(-2deg);
      }

      .p3 {
        left: 1355px;
        top: 58px;
        z-index: 2;
        transform: rotate(2.5deg);
      }

      .p4 {
        left: 1575px;
        top: 105px;
        z-index: 1;
        transform: rotate(7deg);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="veil"></div>
      <div class="wave"></div>
      <div class="glow"></div>

      <div class="content">
        <div class="brand">LTK <span class="tag">Search</span></div>

        <h1>Search</h1>

        <p class="sub">
          Three endpoints became one async path. Search response time fell from 900ms to 200ms.
        </p>

        <div class="features">
          <div class="feature">
            <span class="icon i1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z" />
              </svg>
            </span>
            900 → 200ms
          </div>
          <div class="feature">
            <span class="icon i2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3 9 5-9 5-9-5 9-5Z" />
                <path d="m3 13 9 5 9-5" />
              </svg>
            </span>
            3 SwiftUI components
          </div>
          <div class="feature">
            <span class="icon i3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12 4.5 4.5L19 6.5" />
              </svg>
            </span>
            Maestro flow
          </div>
        </div>

        <p class="label">UX/UI Case Study</p>
      </div>

      <div class="phone p1">
        <img src="../content/images/projects/ltk-search/01-home-feed.webp" alt="" />
      </div>

      <div class="phone p2">
        <img src="../content/images/projects/ltk-search/04-search-results.webp" alt="" />
      </div>

      <div class="phone p3">
        <img src="../content/images/projects/ltk-search/05-creator-profile.webp" alt="" />
      </div>

      <div class="phone p4">
        <img src="../content/images/projects/ltk-search/06-brand-profile.webp" alt="" />
      </div>
    </div>
  </body>
</html>
