<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Globo G1 / GE — banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1983px;
        height: 793px;
        overflow: hidden;
        background: #fff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }

      body { padding: 18px; }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background:
          radial-gradient(760px 560px at 6% 0%, rgba(255, 71, 87, 0.26), transparent 65%),
          radial-gradient(920px 700px at 94% 50%, rgba(0, 210, 106, 0.28), transparent 66%),
          radial-gradient(620px 480px at 46% 112%, rgba(255, 71, 87, 0.10), transparent 70%),
          linear-gradient(120deg, #07080a 0%, #080b0d 55%, #06110b 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.08) 1px, transparent 0);
        background-size: 26px 26px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.8), transparent 58%);
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 820px;
        padding: 48px 0 44px 70px;
      }

      .brand {
        font-family: 'Inter', sans-serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
        color: #fff;
      }

      h1 {
        margin-top: 16px;
        font-size: 132px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.9;
        color: #fff;
      }

      h1 .g1 { color: #ff4757; }
      h1 .ge { color: #00d26a; }
      h1 .amp { color: #fff; font-weight: 500; }

      .sub {
        margin-top: 26px;
        max-width: 660px;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.42;
        letter-spacing: -0.01em;
        color: #9ca3af;
      }

      .features {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-top: 38px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        font-weight: 500;
        color: #d7dbe0;
        white-space: nowrap;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        flex: none;
      }

      .icon svg { width: 22px; height: 22px; }

      .i1 { background: #ff4757; color: #fff; box-shadow: 0 10px 26px -10px rgba(255, 71, 87, 0.7); }
      .i2 { background: #00d26a; color: #06110b; box-shadow: 0 10px 26px -10px rgba(0, 210, 106, 0.7); }
      .i3 { background: #e5e7eb; color: #111827; box-shadow: 0 10px 26px -10px rgba(229, 231, 235, 0.45); }

      .label {
        margin-top: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #e5e7eb;
      }

      /* ------------------------------- phones ------------------------------- */
      .glow {
        position: absolute;
        z-index: 1;
        right: 20px;
        top: 40px;
        width: 960px;
        height: 740px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 210, 106, 0.26), rgba(255, 71, 87, 0.10), transparent 72%);
        filter: blur(18px);
      }

      .phone {
        position: absolute;
        width: 292px;
        height: 632px;
        padding: 11px;
        border-radius: 50px;
        background: linear-gradient(145deg, #ffffff 0%, #e6e8ef 18%, #b7bcc8 52%, #5f636e 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.8) inset,
          0 45px 80px -28px rgba(0, 0, 0, 0.8),
          0 8px 18px rgba(0, 0, 0, 0.35);
      }

      .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 40px;
        background: #000;
      }

      .p1 {
        left: 900px;
        top: 130px;
        z-index: 4;
        transform: rotate(-6deg);
      }

      .p2 {
        left: 1115px;
        top: 82px;
        z-index: 3;
        transform: rotate(-2deg);
      }

      .p3 {
        left: 1320px;
        top: 58px;
        z-index: 2;
        transform: rotate(2.5deg);
      }

      .p4 {
        left: 1525px;
        top: 105px;
        z-index: 1;
        transform: rotate(7deg);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="glow"></div>

      <div class="content">
        <div class="brand">globo</div>

        <h1><span class="g1">G1</span> <span class="amp">&amp;</span> <span class="ge">GE</span></h1>

        <p class="sub">
          Experiências geolocalizadas no G1 &amp; GE e melhorias de segurança nos apps do Grupo Dafiti.
        </p>

        <div class="features">
          <div class="feature">
            <span class="icon i1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
            </span>
            Geolocalização
          </div>
          <div class="feature">
            <span class="icon i2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5V6L12 3Z" />
                <path d="m8.8 12 2.2 2.2 4.4-4.7" />
              </svg>
            </span>
            Segurança
          </div>
          <div class="feature">
            <span class="icon i3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12.5 4.5 4.5L19 6.5" />
              </svg>
            </span>
            Cobertura de testes
          </div>
        </div>

        <p class="label">iOS Case Study</p>
      </div>

      <div class="phone p1">
        <img src="../content/images/projects/globo-dafiti/01-g1-home.webp" alt="" />
      </div>

      <div class="phone p2">
        <img src="../content/images/projects/globo-dafiti/08-ge-home.webp" alt="" />
      </div>

      <div class="phone p3">
        <img src="../content/images/projects/globo-dafiti/05-ge-team-picker.webp" alt="" />
      </div>

      <div class="phone p4">
        <img src="../content/images/projects/globo-dafiti/09-ge-tables.webp" alt="" />
      </div>
    </div>
  </body>
</html>
