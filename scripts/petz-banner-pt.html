<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Petz Clubz — banner em português</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1983px;
        height: 793px;
        overflow: hidden;
        background: #fff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .base {
        position: absolute;
        inset: 0;
        width: 1983px;
        height: 793px;
        display: block;
      }

      .sub,
      .features {
        position: absolute;
        z-index: 2;
      }

      .sub {
        left: 107px;
        top: 329px;
        width: 565px;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: -0.005em;
        color: #3f4659;
      }

      .features {
        left: 105px;
        top: 452px;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 500;
        color: #1f2937;
        white-space: nowrap;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        color: #fff;
        flex: none;
      }

      .icon svg { width: 20px; height: 20px; }

      .i1 { background: #1f5cb5; }
      .i2 { background: #f2b705; }
      .i3 { background: #3f9b45; }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="base" src="./assets/petz-base-en.webp" alt="" />

      <p class="sub">Primeiro fluxo de fidelidade da Petz em SwiftUI. Mais de 1.000 vendas orgânicas na primeira semana.</p>

      <div class="features">
        <div class="feature">
          <span class="icon i1">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.4l6.5-.9L12 2.6Z" />
            </svg>
          </span>
          Primeiro fluxo SwiftUI
        </div>
        <div class="feature">
          <span class="icon i2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 8h14l-1 12H6L5 8Z" />
              <path d="M9 8V6a3 3 0 0 1 6 0v2" />
            </svg>
          </span>
          1.000+ na semana 1
        </div>
        <div class="feature">
          <span class="icon i3">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12.5 4.5 4.5L19 6.5" />
            </svg>
          </span>
          8 telas migradas
        </div>
      </div>
    </div>
  </body>
</html>
