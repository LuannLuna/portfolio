<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Next — banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1983px;
        height: 793px;
        overflow: hidden;
        background: #fff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }

      body { padding: 18px; }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background:
          radial-gradient(900px 680px at 88% 42%, rgba(0, 255, 95, 0.30), transparent 64%),
          radial-gradient(720px 520px at 4% 104%, rgba(0, 255, 95, 0.10), transparent 70%),
          linear-gradient(120deg, #040706 0%, #050a08 55%, #04130b 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.08) 1px, transparent 0);
        background-size: 26px 26px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.75), transparent 58%);
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 820px;
        padding: 54px 0 44px 70px;
      }

      .brand {
        font-family: 'Inter', sans-serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.9;
        color: #00ff5f;
      }

      h1 {
        margin-top: 18px;
        font-size: 128px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.9;
        color: #fff;
      }

      h1 .amp {
        color: #00ff5f;
        font-weight: 500;
      }

      .sub {
        margin-top: 28px;
        max-width: 650px;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.42;
        letter-spacing: -0.01em;
        color: #9ca3af;
      }

      .features {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-top: 38px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        font-weight: 500;
        color: #d7dbe0;
        white-space: nowrap;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        color: #04110a;
        background: linear-gradient(145deg, #6bffa4, #00ff5f 55%, #00c94a);
        box-shadow: 0 10px 26px -10px rgba(0, 255, 95, 0.65);
        flex: none;
      }

      .icon svg { width: 22px; height: 22px; }

      .label {
        margin-top: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #00ff5f;
      }

      /* ------------------------------- phones ------------------------------- */
      .glow {
        position: absolute;
        z-index: 1;
        right: 30px;
        top: 50px;
        width: 940px;
        height: 730px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 255, 95, 0.30), rgba(0, 255, 95, 0.08), transparent 72%);
        filter: blur(18px);
      }

      .phone {
        position: absolute;
        width: 292px;
        height: 632px;
        padding: 11px;
        border-radius: 50px;
        background: linear-gradient(145deg, #ffffff 0%, #e6e8ef 18%, #b7bcc8 52%, #5f636e 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.8) inset,
          0 45px 80px -28px rgba(0, 0, 0, 0.8),
          0 8px 18px rgba(0, 0, 0, 0.35);
      }

      .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 40px;
        background: #000;
      }

      .p1 {
        left: 900px;
        top: 130px;
        z-index: 4;
        transform: rotate(-6deg);
      }

      .p2 {
        left: 1115px;
        top: 82px;
        z-index: 3;
        transform: rotate(-2deg);
      }

      .p3 {
        left: 1320px;
        top: 58px;
        z-index: 2;
        transform: rotate(2.5deg);
      }

      .p4 {
        left: 1525px;
        top: 105px;
        z-index: 1;
        transform: rotate(7deg);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="glow"></div>

      <div class="content">
        <div class="brand">next</div>

        <h1>Auth <span class="amp">&amp;</span> Chat</h1>

        <p class="sub">
          Prototipei permissões sob demanda em RxSwift e fiz pair na integração do SDK da Bia.
        </p>

        <div class="features">
          <div class="feature">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5V6L12 3Z" />
                <path d="m8.8 12 2.2 2.2 4.4-4.7" />
              </svg>
            </span>
            Permissões sob demanda
          </div>
          <div class="feature">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 7-5 5 5 5" />
                <path d="m16 7 5 5-5 5" />
              </svg>
            </span>
            Protótipo RxSwift
          </div>
          <div class="feature">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 5h16v11H8l-4 4V5Z" />
                <path d="M8 9h8M8 12h5" />
              </svg>
            </span>
            SDK da Bia
          </div>
        </div>

        <p class="label">iOS Case Study</p>
      </div>

      <div class="phone p1">
        <img src="../content/images/projects/next-banking/01-home.webp" alt="" />
      </div>

      <div class="phone p2">
        <img src="../content/images/projects/next-banking/02-chat-bia.webp" alt="" />
      </div>

      <div class="phone p3">
        <img src="../content/images/projects/next-banking/03-login.webp" alt="" />
      </div>

      <div class="phone p4">
        <img src="../content/images/projects/next-banking/04-onboarding.webp" alt="" />
      </div>
    </div>
  </body>
</html>
