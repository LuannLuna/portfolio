<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>BeSafe — banner PT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1983px;
        height: 793px;
        overflow: hidden;
        background: #07121f;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      }

      body { padding: 18px; }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 30px;
        overflow: hidden;
        background:
          radial-gradient(820px 640px at 82% 46%, rgba(56, 132, 255, 0.40), transparent 66%),
          radial-gradient(700px 520px at 96% 96%, rgba(76, 214, 192, 0.22), transparent 68%),
          radial-gradient(560px 420px at 58% -10%, rgba(92, 160, 255, 0.16), transparent 64%),
          linear-gradient(122deg, #08182a 0%, #071426 40%, #06111d 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(160, 195, 235, 0.10) 1px, transparent 0);
        background-size: 28px 28px;
        mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0.55), transparent 58%);
      }

      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(7, 18, 31, 0.72) 0%,
          rgba(7, 18, 31, 0.44) 34%,
          rgba(7, 18, 31, 0) 66%
        );
      }

      .content {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 820px;
        padding: 54px 0 44px 70px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-family: 'Inter', sans-serif;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: -0.055em;
        line-height: 1;
        color: #f5f8fc;
      }

      .brand .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #4da3ff;
      }

      h1 {
        margin-top: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 146px;
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 0.86;
        color: #f5f8fc;
      }

      .sub {
        margin-top: 26px;
        max-width: 650px;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.36;
        letter-spacing: -0.01em;
        color: #aebfd2;
      }

      .features {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 38px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 18px;
        font-weight: 500;
        color: #dbe6f2;
        white-space: nowrap;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        color: #07121f;
        box-shadow: 0 10px 26px -10px rgba(0, 0, 0, 0.8);
      }

      .icon svg { width: 22px; height: 22px; }

      .i1 { background: linear-gradient(145deg, #8ecbff, #3b8dff); }
      .i2 { background: linear-gradient(145deg, #9cf0dc, #45cdb0); }
      .i3 { background: linear-gradient(145deg, #c3d4ff, #7a9bff); }

      .label {
        margin-top: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #4da3ff;
      }

      /* ------------------------------- phones ------------------------------- */
      .glow {
        position: absolute;
        z-index: 1;
        right: -30px;
        top: 42px;
        width: 980px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(56, 132, 255, 0.38), rgba(76, 214, 192, 0.16), transparent 72%);
        filter: blur(20px);
      }

      .phone {
        position: absolute;
        width: 292px;
        height: 632px;
        padding: 11px;
        border-radius: 50px;
        background: linear-gradient(145deg, #f2f6fb 0%, #c9d4e2 18%, #7d8b9e 54%, #3a4656 100%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.35) inset,
          0 45px 80px -28px rgba(0, 0, 0, 0.85),
          0 8px 18px rgba(0, 0, 0, 0.4);
      }

      .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 40px;
        background: #000;
      }

      .p1 { left: 918px;  top: 128px; z-index: 1; transform: rotate(-6deg); }
      .p2 { left: 1132px; top: 78px;  z-index: 2; transform: rotate(-2deg); }
      .p3 { left: 1352px; top: 56px;  z-index: 3; transform: rotate(2.5deg); }
      .p4 { left: 1572px; top: 104px; z-index: 4; transform: rotate(7deg); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid"></div>
      <div class="veil"></div>
      <div class="glow"></div>

      <div class="content">
        <div class="brand">BeSafe <span class="tag">iOS</span></div>

        <h1>Proteção</h1>

        <p class="sub">
          Bloqueio em nível de DNS, recuperação de VPN e recursos de cuidado — do TestFlight à App Store.
        </p>

        <div class="features">
          <div class="feature">
            <span class="icon i1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 5 6v6c0 4.4 3 7.4 7 9 4-1.6 7-4.6 7-9V6l-7-3Z" />
                <path d="m9 12 2 2 4-4" />
              </svg>
            </span>
            200k+ sites bloqueados
          </div>
          <div class="feature">
            <span class="icon i2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z" />
                <path d="m4 12 8 4.5 8-4.5" />
                <path d="m4 16.5 8 4.5 8-4.5" />
              </svg>
            </span>
            25 módulos
          </div>
          <div class="feature">
            <span class="icon i3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12 4.5 4.5L19 6.5" />
              </svg>
            </span>
            3.169 testes
          </div>
        </div>

        <p class="label">Estudo de caso iOS</p>
      </div>

      <div class="phone p1">
        <img src="../content/images/projects/besafe-protection/01-landing.webp" alt="" />
      </div>
      <div class="phone p2">
        <img src="../content/images/projects/besafe-protection/03-mood.webp" alt="" />
      </div>
      <div class="phone p3">
        <img src="../content/images/projects/besafe-protection/04-appointments.webp" alt="" />
      </div>
      <div class="phone p4">
        <img src="../content/images/projects/besafe-protection/05-plans.webp" alt="" />
      </div>
    </div>
  </body>
</html>
