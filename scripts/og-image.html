<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luann Luna — OG image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f3f0e9;
        color: #12120f;
        font-family: 'IBM Plex Sans', sans-serif;
      }

      body { padding: 34px 44px; }

      .sheet {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        border-top: 1px solid #cfc9bc;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 0;
        border-bottom: 1px solid #cfc9bc;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6e6a61;
      }

      .top .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 9px;
        background: #d7261e;
        vertical-align: 1px;
      }

      .main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 42px;
        padding: 26px 0 20px;
      }

      h1 {
        font-family: 'Archivo', sans-serif;
        font-weight: 800;
        font-size: 136px;
        line-height: 0.8;
        letter-spacing: -0.055em;
        font-stretch: 112%;
        text-transform: uppercase;
      }

      h1 .signal { color: #d7261e; }

      .role {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: #12120f;
      }

      .detail {
        margin-top: 8px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 0.04em;
        color: #6e6a61;
      }

      .stats {
        display: flex;
        gap: 38px;
        margin-top: 30px;
        padding-top: 13px;
        border-top: 1px solid #cfc9bc;
      }

      .stat {
        display: flex;
        align-items: baseline;
        gap: 7px;
      }

      .stat strong {
        font-family: 'Archivo', sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-stretch: 112%;
      }

      .stat span {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6e6a61;
      }

      figure {
        align-self: start;
        border: 1px solid #cfc9bc;
        background: #eae6dd;
      }

      figure img {
        display: block;
        width: 100%;
        height: 330px;
        object-fit: cover;
        filter: grayscale(1) contrast(1.05);
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid #cfc9bc;
        padding: 7px 9px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6e6a61;
      }

      .bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding-top: 14px;
        border-top: 1px solid #cfc9bc;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6e6a61;
      }

      .bottom .url { color: #12120f; }
    </style>
  </head>
  <body>
    <div class="sheet">
      <header class="top">
        <span><span class="dot"></span>Senior iOS Engineer</span>
        <span>São Luís, Brazil — Remote</span>
        <span>Portfolio / 2026</span>
      </header>

      <main class="main">
        <div>
          <h1>Luann<br />Luna<span class="signal">.</span></h1>
          <p class="role">Senior iOS Engineer</p>
          <p class="detail">Building and maintaining iOS apps since 2018</p>

          <div class="stats">
            <div class="stat"><strong>1.5M+</strong><span>Petz users</span></div>
            <div class="stat"><strong>9</strong><span>brands</span></div>
            <div class="stat"><strong>78%</strong><span>LTK search cut</span></div>
          </div>
        </div>

        <figure>
          <img src="../content/images/profile/luann.jpg" alt="" />
          <figcaption>
            <span>Luann Luna</span>
            <span>BR / 2026</span>
          </figcaption>
        </figure>
      </main>

      <footer class="bottom">
        <span>Selected work / 2018 — 2026</span>
        <span class="url">luannluna.github.io/portfolio</span>
      </footer>
    </div>
  </body>
</html>
